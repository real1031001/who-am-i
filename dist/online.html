<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="친구들이 정해준 비밀 인물을 질문으로 맞히는 도트 추리 게임"><title>WHO AM I · 사교 클럽</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="online.css"></head><body class="online"><header><div class="brand">♜ WHO AM I<small>A PRIVATE SOCIAL CLUB</small></div><div id="phase">사교 클럽에 오신 것을 환영합니다</div><span id="timer" class="timer" aria-live="off"></span><button id="leave" hidden>나가기</button></header><div id="connection" role="status"></div><div id="error" role="alert"></div><div id="welcome"></div><main hidden><aside><h3>참가자 / 차례</h3><div class="legend"><span class="green">■ 나</span> <span class="red">■ 현재 차례</span></div><div id="roster"></div></aside><section class="frame"><div id="stage"></div><div id="bottom"></div></section></main><footer hidden><form id="chat"><label class="sr-only" for="message">채팅 메시지</label><input id="message" placeholder="메시지를 입력하세요" maxlength="160" autocomplete="off"><button>전송</button></form><button id="history">문답 기록</button><button id="sound">소리 꺼짐</button></footer><dialog id="records"><h2>문답 기록</h2><div id="log"></div><button id="closeRecords">닫기</button></dialog><dialog id="leaveConfirm"><h2>방에서 나갈까요?</h2><p>진행 중에 나가면 중도 퇴장으로 처리됩니다.</p><div class="actions"><button id="cancelLeave">계속 참여</button><button class="danger" id="confirmLeave">나가기</button></div></dialog><script src="online.js"></script></body></html>
